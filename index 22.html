<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#12355B;--orange:#FF8A3D;--teal:#19B5B0;--sun:#FFD93D;--mag:#E83E8C;--paper:#FFF9EA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);padding:14px;background:linear-gradient(180deg,#59D6D0 0%,#B4EEE6 40%,#FFE7B8 78%,#FFC48A 100%) fixed;overflow-x:hidden}
.mt{position:fixed;left:0;right:0;bottom:0;height:200px;z-index:0;pointer-events:none}
.bl{position:fixed;z-index:0;pointer-events:none;animation:flo ease-in-out infinite alternate}
@keyframes flo{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-40px) rotate(3deg)}}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.top{background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 6px 0 #12355B40;position:relative;border-left:22px solid var(--orange)}
.top small{color:var(--mag);font-weight:800;letter-spacing:2px}.top h1{margin:0;font-size:clamp(24px,4vw,36px);font-weight:800}
.badge{background:var(--sun);border:3px dashed var(--ink);border-radius:999px;padding:2px 16px;font-weight:800;font-size:20px;display:inline-block}
.fl{position:relative;height:60px;margin:0 8px}
.fl .trk{position:absolute;left:8px;right:8px;top:40px;border-top:5px dotted var(--ink);opacity:.4}
.fl .st{position:absolute;top:32px;width:18px;height:18px;border-radius:4px;transform:rotate(45deg);background:#fff;border:3px solid var(--ink);margin-left:-9px}.fl .st.on{background:var(--mag)}
.fl .pl{position:absolute;top:-2px;transition:left .9s cubic-bezier(.5,1.6,.5,1);margin-left:-22px}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav span{font-weight:800}
.nav button{border:3px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:10px;padding:5px 14px;font-size:16px;font-weight:700;box-shadow:0 4px 0 var(--ink);transition:transform .15s}
.nav button:hover{transform:translateY(-2px) rotate(-1deg)}.nav button.on{background:var(--orange);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:clamp(16px,3vw,30px);display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 #12355B40;animation:pop .45s;position:relative;background-image:repeating-linear-gradient(0deg,transparent 0 31px,#12355B0d 31px 32px)}
.card:after{content:"";position:absolute;right:16px;top:-14px;width:30px;height:30px;border-radius:50%;background:var(--teal);border:4px solid var(--ink)}
.card h2{margin:0;font-size:clamp(20px,3vw,28px)}
.meta{display:flex;justify-content:space-between;font-weight:800;font-size:18px;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:4px double var(--ink)}
.q{font-size:clamp(22px,3.4vw,32px);font-weight:800;line-height:1.3}.q b{color:var(--mag);background:#FFE0EE;border-radius:8px;padding:0 6px}.q u{text-decoration-color:var(--orange);text-decoration-thickness:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.o{display:flex;align-items:center;justify-content:center;gap:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:14px 18px;font-size:clamp(18px,2.6vw,24px);font-weight:700;box-shadow:0 5px 0 var(--ink);transition:transform .12s}
.o:hover:not(:disabled){transform:translateY(-3px);background:#FFF4D6}.o:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.o.ok{background:#8EF0C0;animation:pop .4s}.o.bad{background:#FFB0A8;animation:shake .4s}.o:disabled{cursor:default}
.fb{font-size:22px;font-weight:700;min-height:34px}
.stamp{display:inline-block;border:4px double #12945E;color:#12945E;border-radius:50%;padding:6px 14px;transform:rotate(-8deg);animation:stampin .4s;margin-right:8px;background:#fff;font-size:18px;letter-spacing:1px}.stamp.no{border-color:var(--mag);color:var(--mag)}
.go{align-self:flex-end;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px 32px;font-size:21px;font-weight:800;box-shadow:0 5px 0 #081f38}
.go.alt{background:var(--orange);color:var(--ink);box-shadow:0 5px 0 #b95c1d}.go[disabled]{opacity:.35}.go:active{transform:translateY(3px)}
.row{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.box{background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:12px 20px;font-size:clamp(18px,2.4vw,22px);line-height:1.8}.box b{color:var(--mag)}
.learn{background:#D6F7F3;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;font-size:19px}
.cz{display:grid;grid-template-columns:40px repeat(3,1fr);gap:8px;align-items:center}.cz .o{padding:6px 12px;justify-content:flex-start;border-color:transparent;box-shadow:none;background:transparent;font-size:clamp(17px,2.2vw,22px)}.cz .o.sel{border-color:var(--ink);background:#fff}
.cz .o.ok{background:#8EF0C0}.cz .o.bad{background:#FFB0A8}
.dot{width:26px;height:16px;border:3px solid var(--ink);border-radius:50%;background:#fff;flex:none}.sel .dot{background:var(--ink)}
.dl{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:6px}
.ln{display:block;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;font-size:clamp(16px,2.1vw,20px);color:var(--ink);max-width:88%}.ln b{display:block;font-size:14px;opacity:.8}.ln.H{background:#B9F1EC;align-self:flex-start}.ln.K{background:#FFD3A6;align-self:flex-end}.ln.hl{outline:5px solid var(--sun)}
.ex{border:3px solid var(--ink);border-radius:18px;padding:16px 12px;font-size:clamp(20px,2.8vw,26px);font-weight:800;color:var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}.ex small{font-size:17px;font-weight:600}.ex.seen{outline:5px solid var(--teal)}
.credit{text-align:right;font-size:15px;font-weight:700}
.big-stamp{align-self:center;font-size:clamp(34px,6vw,56px);font-weight:800;color:#12945E;border:6px double #12945E;border-radius:50%;padding:12px 30px;transform:rotate(-6deg);animation:stampin .5s}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes stampin{0%{transform:scale(2.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
</style></head><body>

<div class="wrap">
<div class="top"><div><small>EXPLORER’S PASSPORT · UNIT 3 · TRAVEL · LESSON 7, PART 1</small><h1>How Do You Feel About the Future?</h1></div><div style="text-align:right"><span class="badge" id="stars"></span><br><small style="letter-spacing:0">Adventure time: 25 minutes</small></div></div>
<div class="fl"><div class="trk"></div><div id="stations"></div><span class="pl" id="pl"><svg width="52" height="66" viewBox="0 0 60 84" aria-hidden="true"><path d="M30 2C10 2 2 20 8 36c4 10 12 18 22 24 10-6 18-14 22-24C58 20 50 2 30 2z" fill="#E83E8C" stroke="#12355B" stroke-width="3"/><path d="M30 2c-12 10-12 40 0 58M30 2c12 10 12 40 0 58" fill="none" stroke="#FFD93D" stroke-width="5"/><path d="M22 62h16l-2 8H24z" fill="#C97B2B" stroke="#12355B" stroke-width="2.5"/></svg></span></div>

<script>
const HAPPY=`<svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="24" fill="#FFD93D" stroke="#12355B" stroke-width="3"/><circle cx="19" cy="22" r="3" fill="#12355B"/><circle cx="35" cy="22" r="3" fill="#12355B"/><path d="M15 31q12 14 24 0" fill="none" stroke="#12355B" stroke-width="3.5" stroke-linecap="round"/></svg>`,SAD=`<svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="24" fill="#9FD8FF" stroke="#12355B" stroke-width="3"/><circle cx="19" cy="22" r="3" fill="#12355B"/><circle cx="35" cy="22" r="3" fill="#12355B"/><path d="M16 38q11-12 22 0" fill="none" stroke="#12355B" stroke-width="3.5" stroke-linecap="round"/></svg>`;
const N=a=>a.map(t=>({t}));
const YN=N(['Yes','No']);
const XP=[['I’m (really) looking forward to ...','I’m really looking forward to the holidays.',1,'#B9F1EC'],['I can’t wait (for / to ...)','I can’t wait for the summer holidays.',1,'#FFE08A'],['I’m excited about ...','I’m excited about camping!',1,'#FFD3A6'],['I’m not looking forward to ...','I’m not looking forward to the long journey.',0,'#C9DEFF'],['I’m worried about ...','I’m worried about the language.',0,'#FFC2D9']];
const DLG=[['Helen','Hi Katy! I can’t wait for the summer holidays.'],['Katy','Hi Helen! What are you going to do?'],['Helen','We’re going to go camping. I’m worried about the journey because I don’t like long car journeys. But I’m excited about camping!'],['Katy','Where are you going to camp, Helen?'],['Helen','In a forest!'],['Katy','That sounds great! We’re going to go to Salalah.'],['Helen','How are you going to travel?'],['Katy','By coach. I love travelling by coach. I’m really looking forward to it!'],['Helen','How long’s the journey?'],['Katy','About nine hours.'],['Helen','Wow! That’s a long time!'],['Katy','You’re right. I’ll take some books to read!']];
const QS=[['What are you going to do?','What … do','are … going','you … to'],['Where are you going to sleep?','Where … sleep','are … going','you … to'],['How are you going to travel?','are … going','How … travel','you … to'],['Who are you going to go with?','are … going','you … to','Who … go'],['When are you going to pack?','When … pack','are … going','you … to'],['What are you going to take?','are … going','What … take','you … to']];
const A=[
{n:'1 · Say it!',min:3,type:'expr'},
{n:'2 · Happy or worried?',min:2,type:'mc',q:[
{pr:'“I can’t wait to go!”',o:N(['Happy','Worried or not happy']),a:0},
{pr:'“I’m worried about the language.”',o:N(['Happy','Worried or not happy']),a:1},
{pr:'“I’m really looking forward to the holidays.”',o:N(['Happy','Worried or not happy']),a:0},
{pr:'“I’m not looking forward to the long journey.”',o:N(['Happy','Worried or not happy']),a:1},
{pr:'“I’m excited about camping!”',o:N(['Worried or not happy','Happy']),a:1},
{pr:'“I’m worried about the flight.”',o:N(['Worried or not happy','Happy']),a:0}]},
{n:'3 · Listen and read',min:4,type:'dlg'},
{n:'4 · Circle the answers',min:3,type:'mc',q:[
{pr:'Helen ___ long car journeys.',o:N(['likes','doesn’t like']),a:1},
{pr:'Katy ___ travelling by coach.',o:N(['likes','doesn’t like']),a:0},
{pr:'Where is Helen going to camp?',o:N(['In a forest','On a beach','In the desert']),a:0},
{pr:'Where is Katy going on holiday?',o:N(['Muscat','Salalah','Sohar']),a:1},
{pr:'How long is the journey?',o:N(['About nine hours','About two hours','About one day']),a:0},
{pr:'What will Katy take?',o:N(['Some books to read','Some games','A guidebook']),a:0}]},
{n:'5 · Find the expressions',min:3,type:'mc',q:[
{pr:'“I can’t wait for the summer holidays.”<br>Does it use language from the Say it! box?',o:YN,a:0},
{pr:'“What are you going to do?”<br>Does it use language from the Say it! box?',o:YN,a:1},
{pr:'“I’m worried about the journey.”<br>Does it use language from the Say it! box?',o:YN,a:0},
{pr:'“But I’m excited about camping!”<br>Does it use language from the Say it! box?',o:YN,a:0},
{pr:'“Where are you going to camp, Helen?”<br>Does it use language from the Say it! box?',o:YN,a:1},
{pr:'“I’m really looking forward to it!”<br>Does it use language from the Say it! box?',o:YN,a:0},
{pr:'“How long’s the journey?”<br>Does it use language from the Say it! box?',o:YN,a:1},
{pr:'“I’ll take some books to read!”<br>Does it use language from the Say it! box?',o:YN,a:1}]},
{n:'6 · Make a dialogue',min:4,type:'mc',q:[
{pr:'A: “I’m looking forward to the summer holidays. What are you going to do?”<br>B: “___ and I’m excited about it.”',o:N(['I’m going to visit the mountains','I’m worried about the language','I’m not looking forward to it']),a:0},
{pr:'A: “We’re going to fly to Malaysia.”<br>B: “___ What an adventure!”',o:N(['I’m worried about my homework.','Wow! That sounds great.','I’m not looking forward to that.']),a:1},
{pr:'A: “How do you feel about the long journey?”<br>B: “___”',o:N(['I’m excited the football.','I’m not looking forward to it.','I can wait it.']),a:1},
{pr:'I can’t wait ___ the holidays! (noun)',o:N(['to','about','for']),a:2},
{pr:'I can’t wait ___ go on holiday! (verb)',o:N(['to','for','about']),a:0},
{pr:'I’m excited ___ the trip.',o:N(['of','about','for']),a:1}]},
{n:'7 · Question stress',min:3,type:'mc',q:QS.map(x=>({w:x[0],pr:'Listen: “'+x[0]+'”<br>Which words do you hear most clearly?',o:N([x[1],x[2],x[3]]),a:x[1].split(' … ')[0]&&[x[1],x[2],x[3]].findIndex(t=>t.split(' … ')[0]==={ 'What are you going to do?':'What','Where are you going to sleep?':'Where','How are you going to travel?':'How','Who are you going to go with?':'Who','When are you going to pack?':'When','What are you going to take?':'What'}[x[0]]&&t.split(' … ')[1]==={ 'What are you going to do?':'do','Where are you going to sleep?':'sleep','How are you going to travel?':'travel','Who are you going to go with?':'go','When are you going to pack?':'pack','What are you going to take?':'take'}[x[0]])}))},
{n:'8 · Final task',min:3,type:'cloze'}];
const CL=7;
const C={t:'Salma says, “I {0} (1) the summer holidays!” Mona asks, “What are you going to do?” Salma says, “We’re going to go camping and I’m {1} (2) it. But I’m {2} (3) the long journey because I don’t like cars.” Mona says, “We’re going to fly. I can’t wait {3} (4) go! I’m not {4} (5) the airport queue, though.”',o:[['can’t wait for','am worried about','am not looking forward to'],['worried about','excited about','not looking forward to'],['excited about','worried about','looking forward to'],['for','about','to'],['excited about','looking forward to','worried']],a:[0,1,1,2,1]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,seen:{},hl:null});
let S={step:0,st:A.map(nst)};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t,p){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;u.pitch=p||1;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784,1047],.1,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);try{speechSynthesis.cancel()}catch(e){}S.step=k;render()}
function xp(k){const s=S.st[0];s.seen[k]=1;s.sc=Object.keys(s.seen).length;tone([660,880],.1);say(XP[k][1]);render()}
function line(i){S.st[2].hl=i;say(DLG[i][1],DLG[i][0]==='Helen'?1.35:.85);render()}
function play(){try{speechSynthesis.cancel();DLG.forEach((l,i)=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang='en-GB';u.rate=.9;u.pitch=l[0]==='Helen'?1.35:.85;u.onstart=()=>{S.st[2].hl=i;render()};speechSynthesis.speak(u)})}catch(e){}}
function lis(){say(A[S.step].q[S.st[S.step].i].w)}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]=nst();tone([440,523],.1);render()}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="big-stamp">'+s.sc+' / '+n+'</div><div class="fb" style="text-align:center">'+(s.sc===n?'Excellent! Fantastic work!':s.sc>=n-2?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next stop →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 const lb=q.w?'<div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="lis()">▶ Listen</button></div>':'';
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stamps: '+s.sc+'</span></div>'+lb+'<div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')"><span>'+o.t+'</span></button>').join('')+'</div><div class="fb">'+(lk?(ok?'<span class="stamp">APPROVED</span>':'<span class="stamp no">TRY AGAIN</span>')+'The answer is: '+q.o[q.a].t+'.':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='expr')return '<div class="card"><h2>'+a.n+' · '+a.min+' min — How do you feel about the future? Tap and listen!</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">'+XP.map((x,k)=>'<button class="ex'+(s.seen[k]?' seen':'')+'" style="background:'+x[3]+'" onclick="xp('+k+')">'+(x[2]?HAPPY:SAD)+x[0]+'<small>'+x[1]+'</small></button>').join('')+'</div><div class="learn"><b>Think:</b> What would you like to do on your next holiday? Is there anything you wouldn’t like to do?</div><div class="fb">Expressions heard: '+s.sc+' / 5</div><button class="go alt" onclick="go(1)">Happy or worried? →</button></div>';
 if(a.type==='dlg')return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min — Helen and Katy</span><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="play()">▶ Play the dialogue</button></div><div class="dl">'+DLG.map((l,i)=>'<button class="ln '+(l[0]==='Helen'?'H':'K')+(s.hl===i?' hl':'')+'" onclick="line('+i+')"><b>'+l[0]+'</b>'+l[1]+'</button>').join('')+'</div><button class="go" onclick="go(3)">Circle the answers →</button></div>';
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · English in action</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+(s.chk?'<div class="big-stamp">'+n+' / 5</div>':'')+'<div class="row"><span style="margin-right:auto;font-size:20px;font-weight:700">'+(s.chk?(n===5?'Excellent! Bon voyage!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}

 const L=A.length-1;
 document.getElementById('nav').innerHTML='<span>Choose your stop:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');

 document.getElementById('pl').style.left=(S.step/L*100)+'%';

 document.getElementById('main').innerHTML=view()}
render();
